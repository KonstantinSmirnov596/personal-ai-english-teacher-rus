[project]
name = "trainer"
version = "0.1.0"
description = "Local voice trainer for American English conversation and pronunciation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trainer"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ANN", "SIM", "RUF"]
ignore = [
    "ANN401", # Any is sometimes the honest type for JSON payloads
    "RUF001", # Cyrillic strings are intentional (UI text)
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "gpu: needs the NVIDIA GPU and downloaded models",
    "e2e: drives Microsoft Edge through Playwright with a fake microphone",
    "live: talks to the real LLM provider with the owner's saved key (costs money)",
]
