[project]
name = "trainer"
version = "0.1.0"
description = "Local voice trainer for American English conversation and pronunciation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # GPU stack. torch comes from the CUDA 12.8 index (see [tool.uv.sources]):
    # cu128 supports Blackwell (sm_120) and ships the CUDA 12 / cuDNN 9 DLLs that
    # CTranslate2 (faster-whisper) also needs on Windows.
    "torch==2.11.0",
    "faster-whisper==1.2.1",
    "ctranslate2==4.9.0",
    "kokoro==0.9.4",
    "misaki[en]==0.9.4",
    # spaCy model for misaki; pinned here so it is never downloaded at runtime.
    "en-core-web-sm==3.8.0",
    "transformers==5.22.2",
    "soundfile>=0.13",
    "soxr>=0.5",
    "numpy>=2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trainer"]

[tool.uv]
package = true
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ANN", "SIM", "RUF"]
ignore = [
    "ANN401", # Any is sometimes the honest type for JSON payloads
    "RUF001", # Cyrillic strings are intentional (UI text)
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "gpu: needs the NVIDIA GPU and downloaded models",
    "e2e: drives Microsoft Edge through Playwright with a fake microphone",
    "live: talks to the real LLM provider with the owner's saved key (costs money)",
]
filterwarnings = [
    # Third-party noise from Kokoro's model definition.
    "ignore:dropout option adds dropout:UserWarning",
    "ignore:`torch.nn.utils.weight_norm` is deprecated:FutureWarning",
    "ignore:`torch.jit.script` is deprecated:DeprecationWarning",
]
